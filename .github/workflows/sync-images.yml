name: Sync final production files
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-images.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact production files
        shell: bash
        run: |
          set -e
          mkdir -p assets/images en es it ko pt
          base="https://draydania.com"

          for f in about.jpg ba-body-front.jpg ba-body-side.jpg ba-eye.jpg ba-face.jpg ba-hair.jpg ba-lips.jpg ba-men.jpg ba-weight.jpg favicon.png hero.jpg logo-original.png logo-transparent.png service-body.jpg service-botox.jpg service-prp.jpg service-radiofrequency.jpg service-weight.jpg; do
            curl -fL "$base/assets/images/$f" -o "assets/images/$f"
          done

          curl -fL "$base/index.html" -o index.html
          curl -fL "$base/assets/site.js" -o assets/site.js
          curl -fL "$base/assets/styles.css" -o assets/styles.css
          curl -fL "$base/en/index.html" -o en/index.html
          curl -fL "$base/es/index.html" -o es/index.html
          curl -fL "$base/it/index.html" -o it/index.html
          curl -fL "$base/ko/index.html" -o ko/index.html
          curl -fL "$base/pt/index.html" -o pt/index.html

      - name: Verify production files match final V2 package
        shell: bash
        run: |
          set -e
          test "$(git hash-object index.html)" = "5dca845eb68ca542ef096989979c31a6f1551013"
          test "$(git hash-object assets/site.js)" = "bd80bb7393c9af8678bdeeceb1cd0690f1542c3e"
          test "$(git hash-object assets/styles.css)" = "2b6f0187fff7092c91c65c3cabca5d57fa1870f2"
          test "$(git hash-object en/index.html)" = "7e8a45a3d275a4d9738b0bb9aa673325bdbc6198"
          test "$(git hash-object es/index.html)" = "0509bf51fba5b34e93e10364eb4f9ad871e9adda"
          test "$(git hash-object it/index.html)" = "7f86e14fe6d2549b045e92f69730f07ba18c8a9e"
          test "$(git hash-object ko/index.html)" = "0435028b1fee045786bee52827a90b3b6dbf7bd1"
          test "$(git hash-object pt/index.html)" = "d139e8c2a9f723d2b58d882b45572fd343bf8f26"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Sync exact final V2 production files
          file_pattern: index.html assets/* en/index.html es/index.html it/index.html ko/index.html pt/index.html
