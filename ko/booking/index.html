<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진료 예약 요청 · Dra. Ydania</title><link rel="stylesheet" href="/assets/styles.css"><style>
.booking-shell{width:min(760px,92%);margin:42px auto 80px}.booking-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.booking-grid{display:grid;gap:16px}.booking-card label{display:grid;gap:6px;font-weight:800}.booking-card input,.booking-card select,.booking-card textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.slot{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;cursor:pointer}.slot.selected{background:var(--purple);color:#fff;border-color:var(--purple)}.booking-status{padding:12px 14px;border-radius:12px;background:#f4efea}.booking-note{font-size:.85rem;opacity:.75} .phone-row{display:grid;grid-template-columns:minmax(120px,.38fr) 1fr;gap:10px}.phone-row label{font-size:.82rem;font-weight:700}.phone-row select,.phone-row input{width:100%}@media(max-width:560px){.phone-row{grid-template-columns:1fr 1.6fr}}</style></head><body>
<header><div class="wrap nav"><a class="brand" href="/ko/"><img src="/assets/images/logo-transparent.png" alt="Dra. Ydania"></a><a class="btn alt" href="/ko/">사이트로 돌아가기</a></div></header>
<main class="booking-shell"><div class="eyebrow">예약</div><h1 style="font-size:clamp(2.2rem,6vw,4rem)">진료 예약 요청</h1><p class="lead">원하는 진료와 가능한 시간을 선택하세요. 확인 안내를 받을 때까지 예약은 <strong>진료실 승인 대기 상태</strong>입니다.</p>
<div class="booking-card"><form id="bookingForm" class="booking-grid">
<label>진료 항목<select id="service" required><option value="">진료 항목 불러오는 중…</option></select></label>
<label>날짜<input id="date" type="date" required></label>
<div><strong>예약 가능한 시간</strong><div id="slots" class="slots" style="margin-top:8px"></div></div>
<label>성명<input id="name" autocomplete="name" required></label>
<div><strong>WhatsApp / 전화</strong><div class="phone-row" style="margin-top:6px"><label>국가번호<select id="countryCode" aria-label="국가번호" required><option value="+58">🇻🇪 +58</option><option value="+1">🇺🇸/🇨🇦 +1</option><option value="+52">🇲🇽 +52</option><option value="+34">🇪🇸 +34</option><option value="+39">🇮🇹 +39</option><option value="+55">🇧🇷 +55</option><option value="+82">🇰🇷 +82</option><option value="+57">🇨🇴 +57</option><option value="+54">🇦🇷 +54</option><option value="+51">🇵🇪 +51</option><option value="+56">🇨🇱 +56</option><option value="+593">🇪🇨 +593</option><option value="+598">🇺🇾 +598</option><option value="+595">🇵🇾 +595</option><option value="+591">🇧🇴 +591</option><option value="+506">🇨🇷 +506</option><option value="+507">🇵🇦 +507</option><option value="+1809">🇩🇴 +1 809</option><option value="+44">🇬🇧 +44</option><option value="+33">🇫🇷 +33</option><option value="+49">🇩🇪 +49</option></select></label><label>&nbsp;<input id="phone" type="tel" autocomplete="tel-national" inputmode="tel" placeholder="10 1234 5678" required></label></div></div>
<label>이메일 (선택)<input id="email" type="email" autocomplete="email"></label>
<label>예약 관련 메모 (선택)<textarea id="note" rows="3" placeholder="예: 오전을 선호합니다. 병력이나 민감한 의료 정보는 입력하지 마세요."></textarea></label>
<p class="booking-note">이 양식은 예약 조정을 위한 용도입니다. 병력, 검사 결과 또는 민감한 의료 정보를 보내지 마세요.</p>
<button class="btn purple" id="submitBooking" type="submit" disabled>예약 요청 보내기</button><div id="status" class="booking-status" hidden></div>
</form></div></main>
<script>
const $=s=>document.querySelector(s); let selected=null;
const service=$('#service'),date=$('#date'),slots=$('#slots'),status=$('#status'),submitBooking=$('#submitBooking');
function setBookingReady(ready){submitBooking.disabled=!ready;submitBooking.style.opacity=ready?'1':'.5';submitBooking.style.cursor=ready?'pointer':'not-allowed'}
const serviceNames={"svc-botox":"보툴리눔 톡신","svc-ha-fillers":"히알루론산 필러 (입술, 눈 밑, 턱, 광대, 턱선, 주름/선, 코)","svc-threads":"실 리프팅 (스무스 및 리프팅 실)","svc-skin-treatment":"피부 치료 (클렌징, 재생, PRP)","svc-facial-fat":"안면 국소 지방 감소","svc-hydroaspiration":"하이드로 아스피레이션","svc-body-mesotherapy":"바디 메조테라피","svc-ultracavitation":"울트라캐비테이션","svc-radiofrequency":"고주파","svc-hair-underarms":"제모: 겨드랑이","svc-hair-pubic":"제모: 음모 부위","svc-hair-legs":"제모: 다리","svc-weight-nutrition":"영양 및 체중 관리 상담","svc-followup":"추적 진료","svc-aesthetic-consult":"미용 상담","svc-comprehensive-consult":"종합 상담"};
const clinicToday=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Caracas',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); date.min=clinicToday;
function show(msg,bad=false){status.hidden=false;status.textContent=msg;status.style.background=bad?'#fdecec':'#eef7f1'}
async function loadServices(){
 try{
  const r=await fetch('/api/services'); const d=await r.json(); if(!d.ok)throw new Error(d.error);
  const byId=new Map(d.services.map(x=>[x.id,x])); service.innerHTML='<option value="">선택하세요…</option>';
  function addGroup(label,items){
   const available=items.filter(Boolean).filter(x=>x.booking_enabled); if(!available.length)return;
   const group=document.createElement('optgroup'); group.label=label;
   for(const x of available){const option=document.createElement('option');option.value=x.id;option.textContent=`${serviceNames[x.id]||x.name_en||x.name_es} · ${x.duration_minutes} min`;group.appendChild(option)}
   service.appendChild(group);
  }
  addGroup('얼굴 · 안면 조화',[byId.get('svc-botox'),byId.get('svc-ha-fillers')]);
  addGroup('얼굴 · 콜라겐 바이오스티뮬레이터',[byId.get('svc-threads'),byId.get('svc-skin-treatment'),byId.get('svc-facial-fat')]);
  addGroup('바디',d.services.filter(x=>x.category==='body'));
  addGroup('제모',d.services.filter(x=>x.category==='hair_removal'));
  addGroup('체중 및 대사 건강',d.services.filter(x=>x.category==='weight_metabolic'));
  addGroup('상담',d.services.filter(x=>x.category==='consultation'));
 }catch(e){service.innerHTML='<option value="">예약 시스템 설정 중</option>';show('예약 시스템을 설정 중입니다. 그동안 WhatsApp으로 진료실에 문의해 주세요.',true)}
}
async function loadSlots(){
  selected=null;setBookingReady(false);slots.innerHTML='';
  if(!service.value||!date.value){slots.textContent='진료 항목과 날짜를 선택하면 가능한 시간이 표시됩니다.';return}
  slots.textContent='조회 중…';
  try{
    const r=await fetch(`/api/availability?service=${encodeURIComponent(service.value)}&date=${date.value}`);
    const d=await r.json();if(!d.ok)throw new Error(d.error);
    if(!d.slots.length){slots.textContent='해당 날짜에 가능한 시간이 없습니다. 다른 날짜를 선택해 주세요.';return}
    slots.innerHTML='';
    for(const s of d.slots){
      const b=document.createElement('button');b.type='button';b.className='slot';
      b.textContent=new Intl.DateTimeFormat('en-CA',{hour:'numeric',minute:'2-digit',timeZone:'America/Caracas'}).format(new Date(s.start_at));
      b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=s;setBookingReady(true)};
      slots.appendChild(b)
    }
  }catch(e){slots.textContent='예약 가능 시간을 불러올 수 없습니다.'}
}
service.addEventListener('change',loadSlots);date.addEventListener('change',loadSlots);
$('#bookingForm').addEventListener('submit',async e=>{e.preventDefault();const rawPhone=$('#phone').value.trim();
const selectedCode=$('#countryCode').value;
const phoneDigits=rawPhone.replace(/\D/g,'');
const normalizedPhone=rawPhone.startsWith('+')?'+'+phoneDigits:selectedCode+phoneDigits;
if(!/^\+[1-9]\d{7,14}$/.test(normalizedPhone))return show('유효한 전화번호를 입력해 주세요.',true);if(!selected)return show('시간을 선택하세요.',true);const payload={service_id:service.value,start_at:selected.start_at,patient_name:$('#name').value,patient_phone:normalizedPhone,patient_email:$('#email').value,patient_note:$('#note').value,preferred_language:'ko'};try{const r=await fetch('/api/bookings/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!d.ok)throw new Error(d.error);show('예약 요청이 전송되었습니다. 확정 전에 진료실 승인이 필요합니다. 확인이 가능해지면 WhatsApp으로 안내드립니다.');e.target.reset();selected=null;slots.innerHTML='';setBookingReady(false)}catch(err){show(err.message||'예약 요청을 보낼 수 없습니다.',true)}});loadServices();
</script></body></html>
